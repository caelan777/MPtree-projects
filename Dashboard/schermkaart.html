<style>
/* Layout: a slim bar with tabs, then one full-screen canvas. The overview is a web of the seven parts around Songs; each part opens as its own web, every screen hanging off the screen you reach it from. */
:root {
  --bg: #ffffff;
  --ink: #0b0b0d;
  --soft: #5d5e64;
  --web: #d9d9dc;
  --edge: #8c8d93;
  --pill: #ffffff;

  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0d; --ink: #f4f4f5; --soft: #a3a4aa; --web: #232328; --edge: #6d6e74; --pill: #0b0b0d; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0b0b0d; --ink: #f4f4f5; --soft: #a3a4aa; --web: #232328; --edge: #6d6e74; --pill: #0b0b0d; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); margin: 0; overflow: hidden; display: flex; flex-direction: column; }

.bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--ink); }
.bar h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.03em; margin: 0; }
.bar .sub { font-family: var(--mono); font-size: 12px; color: var(--soft); min-width: 0; }
.bar .tools { margin-left: auto; display: flex; gap: 6px; }
.bar button, .zoom button { font: 500 14px var(--display); background: var(--ink); color: var(--bg); border: 0; border-radius: 99px; padding: 7px 14px; cursor: pointer; }
.bar button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); padding: 5.5px 12px; }
.bar button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.stage { flex: 1 1 auto; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; }
.ring { fill: none; stroke: var(--web); stroke-width: 2; stroke-dasharray: 6 8; }

.edge { stroke: var(--edge); stroke-width: 2.5; fill: none; }

.edge.hot { stroke: var(--ink); stroke-width: 4; }
.lab rect { fill: var(--pill); stroke: var(--edge); stroke-width: 1.5; }
.lab text { font: 500 17px var(--mono); fill: var(--ink); }
.lab.hot rect { stroke: var(--ink); stroke-width: 2.5; }
.arrowhead { fill: var(--edge); }

.node { position: absolute; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translate(-50%, -50%); }
.node button { display: block; padding: 0; width: 120px; height: 240px; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: #fff; cursor: zoom-in; }
.node button img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.node button:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
.node .t { font-weight: 700; font-size: 17px; line-height: 1.15; text-align: center; width: 170px; background: var(--bg); border-radius: 6px; padding: 1px 4px; }
.node.root button { width: 168px; height: 336px; border-width: 5px; border-radius: 24px; }
.node.root .t { font-size: 24px; font-weight: 900; }
.node.hub .t::before { content: attr(data-part) " · "; font-family: var(--mono); font-weight: 500; font-size: 14px; color: var(--soft); }
.node.dim { opacity: .28; }

.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 12px; color: var(--soft); background: var(--bg); padding: 4px 8px; border-radius: 6px; pointer-events: none; max-width: calc(100% - 32px); }

/* Big view */
.zoom { position: fixed; inset: 0; background: rgba(11,11,13,.88); display: flex; align-items: center; justify-content: center; gap: 28px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.zoom img { height: min(86vh, 900px); max-width: 100%; aspect-ratio: 1/2; object-fit: contain; border-radius: 26px; border: 2px solid #fff; background: #fff; }
.zoom .side { color: #fff; max-width: 320px; min-width: 0; }
.zoom .side .id { font-family: var(--mono); font-size: 12px; opacity: .7; }
.zoom .side h2 { font-size: 28px; line-height: 1.1; margin: 4px 0 8px; letter-spacing: -0.02em; }
.zoom .side p { margin: 0 0 6px; opacity: .85; }
.zoom .side .from { font-family: var(--mono); font-size: 13px; opacity: .7; margin-bottom: 16px; }

.zoom button.ghost { background: transparent; color: #fff; border: 1.5px solid #fff; }
.zoom button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (max-width: 700px) { .zoom { flex-direction: column; gap: 12px; } .zoom img { height: 64vh; } .zoom .side { text-align: center; } .zoom .btns { justify-content: center; } .bar .sub { display: none; } }

.tabs { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--web); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--ink); font: 500 14px var(--display); border: 1.5px solid var(--ink); border-radius: 99px; padding: 5px 13px; white-space: nowrap; }
.tabs a .c { font-family: var(--mono); font-size: 11px; color: var(--soft); margin-left: 5px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs a[aria-current="page"] .c { color: var(--bg); opacity: .7; }
.tabs a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; max-width: calc(100% - 32px); pointer-events: none; }
.where h2 { margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: -0.03em; line-height: 1; background: var(--bg); display: inline; }
.where p { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; color: var(--soft); background: var(--bg); display: inline-block; padding: 2px 0; }
.node.part button { width: 150px; height: 300px; border-width: 4px; border-radius: 22px; cursor: pointer; }
.node.part .t { font-size: 22px; font-weight: 900; width: 220px; }
.node.part .go { font-family: var(--mono); font-size: 14px; color: var(--bg); background: var(--ink); border-radius: 99px; padding: 3px 12px; }
.node.part .cnt { font-family: var(--mono); font-size: 14px; color: var(--soft); }
</style>

<div class="bar">

<script>
// Each node: file, title, the tap on the screen before that leads here, children, note.
const N = (file, title, tap, kids = [], note = "") => ({ file, title, tap, kids, note });

// The parts. "tap" is how you get into the part from Songs (shown on the overview).
const PARTS = [
  { id: "start", name: "Eerste start", tap: "eerste keer openen", how: "Alleen de eerste keer, of als MPTree geen toegang tot je muziek heeft. Daarna kom je op Songs.", inward: true,
    tree: N("start-01-welcome", "Welkom", "", [
      N("start-02-welcome-2", "Klaar om te beginnen", "Next", [
        N("start-04-tour-1", "Rondleiding 1: het logo", "Enter MPTree", [
          N("start-05-tour-2", "Rondleiding 2: zoeken", "Next", [
            N("start-06-tour-3", "Rondleiding 3: afspelen", "Next", [
              N("start-07-music-hint", "Hint: gratis muziek", "Next", [], "Blijft staan tot je op OK tikt. Daarna ben je op Songs."),
            ]),
          ]),
        ]),
      ]),
    ], "Opent vanzelf bij de eerste start.") },
  { id: "songs", name: "Songs", tap: "", how: "Het beginscherm. Alles in de kaart bovenaan, behalve de knoppen die naar een ander deel gaan.",
    tree: N("songs-01-home", "Songs", "", [
      N("songs-02-search", "Zoeken", "zoekveld"),
      N("songs-03-sort", "Sorteren", "Newest First"),
      N("songs-04-header-folded", "Kaart ingevouwen", "logo"),
      N("songs-05-select", "Selecteren", "nummer vasthouden", [
        N("songs-06-edit-several", "Meerdere bewerken", "Edit"),
      ]),
    ], "Het beginscherm.") },
  { id: "menu", name: "Song-menu", tap: "⋮ bij nummer", how: "De drie puntjes naast een nummer. Ook bereikbaar via ⋮ in de grote speler.",
    tree: N("song-01-menu", "Song-menu", "", [
      N("song-02-add-to-playlist", "Aan playlist toevoegen", "Add to"),
      N("song-03-lyrics", "Songtekst", "Lyrics"),
      N("song-04-cut", "Knippen", "Cut"),
      N("song-06-edit", "Nummer bewerken", "Edit"),
      N("song-07-bin", "Naar prullenbak", "Bin", [], "Vraagt eerst of het zeker is."),
    ]) },
  { id: "speler", name: "Speler", tap: "tik op nummer", how: "De mini-speler staat onderaan zodra er iets speelt.",
    tree: N("player-01-mini", "Mini-speler", "", [
      N("player-02-full", "Grote speler", "tik op mini-speler", [
        N("player-03-cover", "Hoes i.p.v. plaat", "tik op plaat"),
        N("player-04-lyrics", "Songtekst", "Lyrics"),
        N("player-06-next-up", "Wachtrij", "Next up"),
        N("player-07-more", "Menu in speler", "⋮"),
      ]),
    ]) },
  { id: "playlists", name: "Playlists", tap: "tab Playlists", how: "Bovenaan de vier vaste lijsten, daaronder je eigen playlists.",
    tree: N("lists-01-playlists", "Playlists", "", [
      N("lists-02-favourites", "Vaste lijst", "My Favorites"),
      N("lists-03-new", "Nieuwe playlist", "+ New playlist"),
      N("lists-04-playlist", "Een playlist", "eigen playlist", [
        N("lists-05-add-songs", "Nummers toevoegen", "+ Add"),
        N("lists-06-delete", "Playlist verwijderen", "prullenbak"),
      ]),
    ]) },
  { id: "ontdekken", name: "Ontdekken", tap: "pijltje omlaag", how: "Gratis muziek van Audius en het Internet Archive. Altijd zwart, ook in witte modus.",
    tree: N("discover-01-home", "Ontdekken", "", [
      N("discover-02-popular", "Populaire nummers", "See all"),
      N("discover-03-artist", "Een artiest", "artiest"),
    ]) },
  { id: "prodag", name: "Pro-dag voorbij", tap: "24 uur na de reclame", how: "Wie Pro een dag heeft via een reclame, krijgt dit als de 24 uur om zijn. Pro blijft aan tot je antwoordt.",
    tree: N("pro-01-day-over", "Je dag Pro is voorbij", "", [
      N("pro-03-hour-over", "Je extra uur is voorbij", "Not now +1 uur", [
        N("pro-04-pro-off", "Pro staat uit", "Not now", [
          N("pro-05-get-pro", "Pro kopen, zonder Pro", "Buy Pro", [], "Ook via Buy Pro op de twee schermen ervoor. In de echte app staat hier ook de kaart om een reclame te kijken."),
        ], "Pro is uit en de app krijgt weer de gewone stijl."),
      ], "Not now zet Pro nu uit."),
    ], "Watch an ad geeft weer 24 uur. Not now houdt Pro nog een uur aan.") },
  { id: "instellingen", name: "Instellingen", tap: "tandwiel", how: "Eén lange lijst. De meeste rijen openen een eigen scherm.",
    tree: N("settings-01-top", "Instellingen", "", [
      N("settings-17-pro", "Pro kopen", "Get MPTree Pro"),
      N("settings-19-pro-on", "Pro staat aan", "MPTree Pro is on"),
      N("settings-15-account", "Account, uitgelogd", "Account & sync", [
        N("settings-16-account-signed-in", "Account, ingelogd", "Sign in with Google"),
      ]),
      N("settings-04-personalise", "Personaliseren", "Personalise", [
        N("settings-05-personalise-records", "Personaliseren, lager", "scrollen"),
      ]),
      N("settings-06-language", "Taal", "Language"),
      N("settings-02-middle", "Instellingen, midden", "scrollen", [
        N("settings-07-audio-effects", "Audio-effecten", "Audio Effects"),
        N("settings-09-removed-songs", "Verwijderde nummers", "Removed songs"),
        N("settings-03-bottom", "Instellingen, onder", "scrollen", [
          N("settings-10-clean-up", "Opruimen", "Clean up"),
          N("settings-11-backup", "Backup & herstel", "Backup & restore"),
          N("settings-12-about", "Over MPTree", "About MPTree", [
            N("settings-13-questions", "Vragen", "Questions"),
            N("settings-14-licences", "Licenties", "Licences"),
          ]),
        ]),
      ]),
    ]) },
];
const flat = t => [t, ...t.kids.flatMap(flat)];
for (const p of PARTS) { p.nodes = flat(p.tree); (function up(n, par) { n.parent = par; n.kids.forEach(k => up(k, n)); })(p.tree, null); }
const byId = Object.fromEntries(PARTS.map(p => [p.id, p]));
document.getElementById("total").textContent = PARTS.reduce((s, p) => s + p.nodes.length, 0);

// ── Drawing helpers.
const NS = "http://www.w3.org/2000/svg";
const world = document.getElementById("world"), svg = document.getElementById("lines");
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.append(e); return e; };
let edgeLayer, labLayer, edges = [];
function clip(from, to, half) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const t = Math.min(Math.abs(half.w / (dx || 1e-6)), Math.abs(half.h / (dy || 1e-6)));
  return { x: from.x + dx * Math.min(t, 0.45), y: from.y + dy * Math.min(t, 0.45) };
}
function edge(a, b, tap, ha, hb) {
  const p1 = clip(a, b, ha), p2 = clip(b, a, hb);
  const line = el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "edge", "marker-end": "url(#ah)" }, edgeLayer);
  const lab = el("g", { class: "lab", transform: `translate(${(p1.x + p2.x) / 2} ${(p1.y + p2.y) / 2})` }, labLayer);
  if (tap) {
    const w = [...tap].length * 10.4 + 18;
    el("rect", { x: -w / 2, y: -15, width: w, height: 30, rx: 15 }, lab);
    el("text", { x: 0, y: 6, "text-anchor": "middle" }, lab).textContent = tap;
  }
  edges.push({ a, b, line, lab });
}
let SIZE = 1000, OFF = 500;
function reset(radii) {
  world.querySelectorAll(".node").forEach(n => n.remove());
  svg.innerHTML = ""; edges = [];
  const R = radii[radii.length - 1] + 300; SIZE = R * 2; OFF = R;
  world.style.width = world.style.height = SIZE + "px";
  svg.setAttribute("width", SIZE); svg.setAttribute("height", SIZE); svg.setAttribute("viewBox", `${-R} ${-R} ${SIZE} ${SIZE}`);
  const defs = el("defs", {}, svg);
  const mk = el("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", class: "arrowhead" }, mk);
  const web = el("g", {}, svg);
  radii.slice(1).forEach(r => el("circle", { cx: 0, cy: 0, r, class: "ring" }, web));
  const outer = radii[radii.length - 1];
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; el("line", { x1: 0, y1: 0, x2: Math.cos(a) * outer, y2: Math.sin(a) * outer, class: "spoke" }, web); }
  edgeLayer = el("g", {}, svg); labLayer = el("g", {}, svg);
}
function phone(n, cls, html, onTap) {
  const d = document.createElement("div");
  d.className = "node " + cls;
  d.style.left = (n.x + OFF) + "px"; d.style.top = (n.y + OFF) + "px";
  d.innerHTML = `<button type="button" aria-label="${html.label}"><img src="s/${n.file}.webp" alt="" draggable="false"></button>${html.under}`;
  d.querySelector("button").addEventListener("click", e => { if (moved) { e.preventDefault(); return; } onTap(); });
  world.append(d); return d;
}

// ── Overview: Songs in the middle, the other parts around it.
function drawOverview() {
  const others = PARTS.filter(p => p.id !== "songs"), r = 720;
  reset([0, r]);
  const center = { x: 0, y: 0, file: byId.songs.tree.file };
  const songs = byId.songs;
  phone(center, "part root", { label: "Open het web van Songs", under: `<div class="t">Songs</div><div class="cnt">${songs.nodes.length} schermen</div><span class="go">Open web →</span>` }, () => go("songs"));
  others.forEach((p, i) => {
    const a = -Math.PI / 2 + i / others.length * Math.PI * 2;
    const n = { x: Math.cos(a) * r, y: Math.sin(a) * r, file: p.tree.file };
    const H = { w: 82, h: 160 }, RH = { w: 90, h: 175 };
    if (p.inward) edge(n, center, "daarna", H, RH); else edge(center, n, p.tap, RH, H);
    phone(n, "part", { label: "Open het web van " + p.name, under: `<div class="t">${p.name}</div><div class="cnt">${p.nodes.length} schermen</div><span class="go">Open web →</span>` }, () => go(p.id));
  });
  setWhere("Overzicht", "Tik op een deel om zijn eigen web te openen.");
  order = PARTS.map(p => Object.assign({}, p.tree, { title: p.name, partOf: p, overview: true }));
}

// ── One part: its first screen in the middle, the rest on rings.
function drawPart(p) {
  const chain = p.nodes.every(n => n.kids.length <= 1);
  if (chain) {
    // A straight path: lay it out as a zigzag row so it fits a screen.
    const cols = 3, gx = 330, gy = 470;
    p.nodes.forEach((n, i) => { const row = Math.floor(i / cols), c = row % 2 ? cols - 1 - (i % cols) : i % cols; n.x = (c - 1) * gx; n.y = (row - (Math.ceil(p.nodes.length / cols) - 1) / 2) * gy; });
    reset([0, 700]);
    svg.querySelector("g").remove();
  } else {
    const leaves = n => n.kids.length ? n.kids.reduce((s, k) => s + leaves(k), 0) : 1;
    const L = leaves(p.tree), depth = Math.max(...p.nodes.map(n => { let d = 0; for (let q = n; q.parent; q = q.parent) d++; return d; }));
    const r1 = Math.max(420, 330 * L / (2 * Math.PI)), step = 420;
    const radii = [0, ...Array.from({ length: depth }, (_, i) => r1 + i * step)];
    reset(radii);
    let cur = -Math.PI / 2 - Math.PI / L;
    (function place(n, d) {
      n.d = d;
      if (!n.kids.length) { n.a = cur + Math.PI / L; cur += 2 * Math.PI / L; }
      else { n.kids.forEach(k => place(k, d + 1)); n.a = (n.kids[0].a + n.kids[n.kids.length - 1].a) / 2; }
    })(p.tree, 0);
    for (const n of p.nodes) { n.x = Math.cos(n.a) * radii[n.d]; n.y = Math.sin(n.a) * radii[n.d]; }
    p.tree.x = 0; p.tree.y = 0;
  }
  const H = { w: 66, h: 126 }, RH = { w: 90, h: 174 };
  for (const n of p.nodes) if (n.parent) edge(n.parent, n, n.tap, n.parent === p.tree && !chain ? RH : H, H);
  order = chain ? p.nodes : [];
  if (!chain) (function seq(n) { order.push(n); n.kids.forEach(seq); })(p.tree);
  order.forEach((n, i) => n.i = i);
  for (const n of p.nodes) {
    const d = phone(n, n === p.tree && !chain ? "root" : "", { label: "Vergroot: " + n.title, under: `<div class="t">${n.title}</div>` }, () => open(n.i));
    d.addEventListener("pointerenter", () => light(n)); d.addEventListener("pointerleave", () => light(null));
  }
  setWhere(p.name, p.tap && !p.inward ? `Vanuit Songs: ${p.tap}. ${p.how}` : p.how);
}
function light(n) {
  const path = new Set(); for (let q = n; q; q = q.parent) path.add(q);
  for (const e of edges) { const hot = !!n && path.has(e.a) && path.has(e.b); e.line.classList.toggle("hot", hot); e.lab.classList.toggle("hot", hot); }
}
function setWhere(t, p) { document.getElementById("wt").textContent = t; document.getElementById("wp").textContent = p; }

// ── Tabs and the address (#start, #songs, ...).
const tabs = document.getElementById("tabs");
const tabList = [{ id: "overzicht", name: "Overzicht" }, ...PARTS];
tabs.innerHTML = tabList.map(t => `<a href="#${t.id}" data-id="${t.id}">${t.name}${t.nodes ? `<span class="c">${t.nodes.length}</span>` : ""}</a>`).join("");
let order = [], view = "overzicht";
function go(id) { if (location.hash !== "#" + id) location.hash = id; else render(); }
function render() {
  const id = location.hash.slice(1);
  view = byId[id] ? id : "overzicht";
  for (const a of tabs.querySelectorAll("a")) { const on = a.dataset.id === view; on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  if (view === "overzicht") drawOverview(); else drawPart(byId[view]);
  document.getElementById("hint").textContent = view === "overzicht"
    ? "Tik op een deel om zijn web te openen. Sleep om te schuiven, knijp of scroll om te zoomen."
    : "Tik op een scherm om het te vergroten. Sleep om te schuiven, knijp of scroll om te zoomen.";
  fit();
}
addEventListener("hashchange", render);

// ── Pan and zoom.
const stage = document.getElementById("stage");
let s = 0.3, tx = 0, ty = 0, moved = false;
const apply = () => world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
function fit() {
  const nodes = [...world.querySelectorAll(".node")];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) { const x = parseFloat(n.style.left), y = parseFloat(n.style.top); x0 = Math.min(x0, x - 120); x1 = Math.max(x1, x + 120); y0 = Math.min(y0, y - 200); y1 = Math.max(y1, y + 230); }
  const w = stage.clientWidth, h = stage.clientHeight, top = 70;
  s = Math.min(w / (x1 - x0), (h - top - 30) / (y1 - y0), 1.1);
  tx = (w - (x1 - x0) * s) / 2 - x0 * s; ty = top + (h - top - 30 - (y1 - y0) * s) / 2 - y0 * s; apply();
}
function zoomAt(f, cx, cy) {
  const ns = Math.max(0.08, Math.min(2.5, s * f));
  tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply();
}
const pts = new Map(); let last = null, pinch = null, downAt = null;
stage.addEventListener("pointerdown", e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { moved = false; downAt = { x: e.clientX, y: e.clientY }; last = downAt; }
  if (pts.size === 2) { const [p, q] = [...pts.values()]; pinch = { d: Math.hypot(p.x - q.x, p.y - q.y) }; }
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = stage.getBoundingClientRect();
  if (pts.size === 2 && pinch) {
    const [p, q] = [...pts.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt(d / pinch.d, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top); pinch.d = d; moved = true; return;
  }
  if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) { moved = true; stage.classList.add("dragging"); if (!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId); }
  if (moved) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
  last = { x: e.clientX, y: e.clientY };
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { stage.classList.remove("dragging"); setTimeout(() => moved = false, 0); } else last = [...pts.values()][0]; };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const mid = () => [stage.clientWidth / 2, stage.clientHeight / 2];
document.getElementById("zin").onclick = () => zoomAt(1.4, ...mid());
document.getElementById("zout").onclick = () => zoomAt(1 / 1.4, ...mid());
document.getElementById("fit").onclick = fit;
addEventListener("resize", fit);

// ── The big view, through the screens of the part you are in.
const z = document.getElementById("zoom"); let cur = 0, opener = null;
function show(i) {
  cur = (i + order.length) % order.length; const n = order[cur];
  const img = document.getElementById("zimg"); img.src = "s/" + n.file + ".webp"; img.alt = n.title;
  document.getElementById("zid").textContent = byId[view].name + " · " + (cur + 1) + " van " + order.length;
  document.getElementById("zt").textContent = n.title;
  document.getElementById("znote").textContent = n.note;
  const p = byId[view];
  document.getElementById("zfrom").textContent = n.parent ? `Vanuit ${n.parent.title}: ${n.tap}` : p.tap && !p.inward ? `Vanuit Songs: ${p.tap}` : "";
}
function open(i) { opener = document.activeElement; show(i); z.hidden = false; document.getElementById("znext").focus(); }
function close() { z.hidden = true; opener?.focus(); }
document.getElementById("zprev").onclick = () => show(cur - 1);
document.getElementById("znext").onclick = () => show(cur + 1);
document.getElementById("zclose").onclick = close;
z.addEventListener("click", e => { if (e.target === z) close(); });
addEventListener("keydown", e => {
  if (z.hidden) return;
  if (e.key === "Escape") close(); else if (e.key === "ArrowRight") show(cur + 1); else if (e.key === "ArrowLeft") show(cur - 1);
});
render();
</script>

</body></html>
