<!doctype html>
<meta charset="utf-8">
<title>MPTree, the ad</title>
<!--
  The ad itself. Every frame is drawn here, in one canvas, by drawFrame(f).

  Nothing animates by itself: there is no CSS animation and no rAF-driven
  state. A frame is a pure function of its number, so frame 391 looks the
  same whether it was rendered first or last, and a re-render never comes
  out subtly different from the one before it.

  Two ways in:
    ad.build.html          opens in a browser and plays on a loop, for looking
    ad.build.html#render   sits still and waits for make-ad.mjs to drive it

  make-ad.mjs builds this file from ad.html by filling in the three holes
  below with the real mark and the real screenshots. Do not edit the built
  copy; edit this one and render again.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; display: block; }
</style>
<canvas id="stage"></canvas>
<script>
/* ── Filled in by make-ad.mjs ─────────────────────────────────────────── */
const MARK_PATH = "__MARK__";
const SHOTS     = __SHOTS__;
const CONFIG    = __CONFIG__;
/* [{ at: seconds into the film, audio: data URI }], empty when there is no
   voiceover to lay in. See voice/lines.json. */
const VOICE     = __VOICE__;

const W = CONFIG.width, H = CONFIG.height, FPS = CONFIG.fps;
const DURATION = CONFIG.duration;
const TOTAL = Math.round(DURATION * FPS);

const cv = document.getElementById("stage");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d", { alpha: false });

// The screenshots are 1080 wide and land about 730 wide. At the default
// filtering that two-thirds reduction eats the app's smaller type and leaves
// it crawling. This costs milliseconds a frame and is the single biggest
// difference in how sharp the phone looks.
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

/**
 * Vertical placement, as a fraction of the part of the frame that is actually
 * free. On TikTok the bottom fifth is under the caption, the username and the
 * buttons, so a version for it hands over that band and composes into what is
 * left. Everywhere else the stage is the whole frame.
 */
const SAFE_T = CONFIG.safeTop || 0;
const SAFE_B = CONFIG.safeBottom || 0;
const Y = f => (SAFE_T + f * (1 - SAFE_T - SAFE_B)) * H;

const FONT = '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';

/* ── Small maths ──────────────────────────────────────────────────────── */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
/** Progress across [a, b] in seconds, flat 0 before and flat 1 after. */
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const outCubic  = p => 1 - Math.pow(1 - p, 3);
const outQuint  = p => 1 - Math.pow(1 - p, 5);
const inOutCube = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const mix = (a, b, p) => a + (b - a) * p;

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ── Type ─────────────────────────────────────────────────────────────────
   Lines do not fade in, they wipe in from the left behind a moving edge and
   rise the last few pixels into place. A fade says "a computer put this
   here"; a wipe is how a title is cut by hand, and it holds the eye for the
   half second the line needs to be read. ─────────────────────────────── */
function line(str, x, y, o = {}) {
  const size   = o.size   || 64;
  const weight = o.weight || 600;
  const colour = o.colour || "#ffffff";
  const p      = o.p === undefined ? 1 : clamp01(o.p);
  if (p <= 0) return 0;

  ctx.save();
  ctx.font = weight + " " + size + "px " + FONT;
  ctx.letterSpacing = (o.track || 0) + "px";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  const w = ctx.measureText(str).width;
  const e = outQuint(p);

  ctx.beginPath();
  ctx.rect(x - w / 2 - 8, y - size * 1.15, w * e + 16, size * 1.7);
  ctx.clip();
  // The edge does the work. What it has passed is already at full strength,
  // because a letter sitting at five per cent looks like dirt on the lens,
  // not like a word arriving. Multiplied, so a caller's fade still counts.
  ctx.globalAlpha *= Math.min(1, p * 9);
  ctx.fillStyle = colour;
  ctx.fillText(str, x, y + (1 - e) * size * 0.16);
  ctx.restore();
  return w;
}

/** A stack of lines sharing one entrance, each a beat behind the last. */
function lines(list, x, top, o = {}) {
  const size = o.size || 64;
  const lead = o.lead || size * 1.22;
  list.forEach((str, i) => {
    const p = o.p === undefined ? 1 : clamp01((o.p - i * (o.stagger || 0.16)) / (1 - (list.length - 1) * (o.stagger || 0.16)));
    line(str, x, top + i * lead, Object.assign({}, o, { p }));
  });
}

/* ── The record ───────────────────────────────────────────────────────────
   Drawn rather than photographed so it can turn. It is the same shape the
   website spins in its hero, and it is the only picture in the film that is
   not a screenshot. 33 1/3 rpm, because that is what the thing it is
   imitating does. ───────────────────────────────────────────────────── */
const RPM = 33 + 1 / 3;
const mark = new Path2D(MARK_PATH);

function record(cx, cy, r, angle, o = {}) {
  const grooves = o.grooves === undefined ? 1 : clamp01(o.grooves);
  const alpha   = o.alpha === undefined ? 1 : clamp01(o.alpha);
  const labelP  = o.label === undefined ? 1 : clamp01(o.label);
  if (alpha <= 0 || r <= 0) return;

  ctx.save();
  ctx.globalAlpha *= alpha;

  // The disc. Near black, so it reads as an object against the ground
  // rather than a hole cut in it.
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.05, cx, cy, r);
  g.addColorStop(0,    "#1c1c1c");
  g.addColorStop(0.55, "#101010");
  g.addColorStop(1,    "#060606");
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();

  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(255,255,255,0.20)";
  ctx.stroke();

  // Grooves, laid down from the label outwards as the disc forms.
  const N = 44;
  const shown = Math.round(N * grooves);
  for (let i = 0; i < shown; i++) {
    const rr = mix(r * 0.375, r * 0.965, i / (N - 1));
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.lineWidth = i % 7 === 0 ? 1.6 : 1;
    ctx.strokeStyle = i % 7 === 0 ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.045)";
    ctx.stroke();
  }

  // Two lobes of light sweeping the surface. Concentric circles cannot show
  // rotation on their own, and without this the disc looks frozen.
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.97, 0, Math.PI * 2); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(angle * 0.55);
  const sheen = ctx.createLinearGradient(-r, -r, r, r);
  sheen.addColorStop(0,    "rgba(255,255,255,0)");
  sheen.addColorStop(0.30, "rgba(255,255,255,0.075)");
  sheen.addColorStop(0.44, "rgba(255,255,255,0)");
  sheen.addColorStop(0.62, "rgba(255,255,255,0)");
  sheen.addColorStop(0.76, "rgba(255,255,255,0.055)");
  sheen.addColorStop(1,    "rgba(255,255,255,0)");
  ctx.fillStyle = sheen;
  ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.restore();

  // The label, and the mark turning with it.
  if (labelP > 0) {
    const lr = r * 0.355 * outCubic(labelP);
    ctx.save();
    ctx.globalAlpha *= Math.min(1, labelP * 2);
    ctx.beginPath(); ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();

    const s = lr * 1.18;
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(s / 1000, s / 1000);
    ctx.translate(-500, -500);
    ctx.fillStyle = "#000000";
    ctx.fill(mark, "evenodd");
    ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, r * 0.038, 0, Math.PI * 2);
    ctx.fillStyle = "#000000"; ctx.fill();
  }
  ctx.restore();
}

/* ── The phone ────────────────────────────────────────────────────────────
   The screens inside it are real captures of the running app, so a frame of
   this film cannot claim an interface the app does not have. ─────────── */
const imgs = {};
for (const [name, uri] of Object.entries(SHOTS)) {
  const im = new Image(); im.src = uri; imgs[name] = im;
}

function phone(x, top, w, draw) {
  const pad = w * 0.021;
  const r   = w * 0.092;
  const h   = H - top + 120;
  ctx.save();

  const body = ctx.createLinearGradient(x - w / 2, top, x + w / 2, top + w * 2.2);
  body.addColorStop(0,    "#4a4a55");
  body.addColorStop(0.22, "#191920");
  body.addColorStop(0.65, "#0a0a0d");
  body.addColorStop(1,    "#33333c");
  roundRect(x - w / 2, top, w, h, r);
  ctx.fillStyle = body; ctx.fill();

  // A dark phone on a dark ground is a dark nothing. The rim is what says
  // "this is a device", and without it the screenshot floats.
  const rim = ctx.createLinearGradient(x - w / 2, top, x + w / 2, top + h * 0.6);
  rim.addColorStop(0,    "rgba(255,255,255,0.58)");
  rim.addColorStop(0.35, "rgba(255,255,255,0.20)");
  rim.addColorStop(1,    "rgba(255,255,255,0.08)");
  ctx.lineWidth = 2.5; ctx.strokeStyle = rim; ctx.stroke();

  roundRect(x - w / 2 + pad, top + pad, w - pad * 2, h - pad * 2, r - pad);
  ctx.save(); ctx.clip();
  ctx.fillStyle = "#000"; ctx.fillRect(x - w / 2, top, w, h);
  draw(x - w / 2 + pad, top + pad, w - pad * 2);
  ctx.restore();

  ctx.restore();
}

/**
 * One screenshot filling the screen's width, pushed in very slightly over the
 * length of a beat.
 *
 * It creeps rather than scrolls on purpose. Sliding the picture up would cut
 * the app's header off, and the header does not scroll in the real app, so the
 * shot would be showing an interface MPTree does not have.
 */
function screen(name, sx, sy, sw, zoom) {
  const im = imgs[name];
  if (!im || !im.complete || !im.naturalWidth) return;
  const w = sw * zoom;
  ctx.drawImage(im, sx - (w - sw) / 2, sy, w, w * im.naturalHeight / im.naturalWidth);
}

/* ── The film ─────────────────────────────────────────────────────────── */
/* One phone beat is one bar, and the whole film is cut to it: 2.733 seconds a
   bar is 87.8 BPM, which is why the score below can land on every cut without
   either being bent to fit the other. */
const BEAT_LEN = 2.7333;          // a bar
const BEAT     = BEAT_LEN / 4;    // a quarter note, 0.6833s
const BAR0     = 5.2 - 2 * BEAT_LEN;

/* Every cut is a bar line. */
const T = {
  open:  0,                      // the record forms and the promise is made
  proof: BAR0 + 2 * BEAT_LEN,    // 5.200  three screens of the real thing
  facts: BAR0 + 5 * BEAT_LEN,    // 13.400 what it does not do
  end:   BAR0 + 6 * BEAT_LEN,    // 16.133
};
/* The captioned film and the clean one, which carries no writing until the end
   card. The clean cut is for laying your own captions over, and for the places
   that put their own furniture on top of everything anyway.

   It is not the same film with the words switched off. Losing the statement
   card would leave nearly three seconds of black in the middle, which reads as
   a fault on mute, so that bar gets a fourth screen and the three hits in the
   score land on it instead of on three lines. */
const TEXT = CONFIG.text !== false;

const BEATS = TEXT ? [
  // This beat used to read "No account. No subscription." The end card says
  // no subscription now, so the library screen describes the library instead
  // of saying the same thing ten seconds early.
  { at: BAR0 + 2 * BEAT_LEN, shot: "songs",     head: ["It finds your music.", "You just press play."] },
  { at: BAR0 + 3 * BEAT_LEN, shot: "player",    head: ["A player worth", "opening."] },
  { at: BAR0 + 4 * BEAT_LEN, shot: "playlists", head: ["Playlists that", "fill themselves."] },
] : [
  { at: BAR0 + 2 * BEAT_LEN, shot: "songs" },
  { at: BAR0 + 3 * BEAT_LEN, shot: "player" },
  { at: BAR0 + 4 * BEAT_LEN, shot: "playlists" },
  { at: BAR0 + 5 * BEAT_LEN, shot: "menu" },
];

/** Where the phones give way: to the statement card, or straight to the end. */
const PROOF_END = TEXT ? T.facts : T.end;

function drawFrame(f) {
  const t = f / FPS;

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);

  const spin = Math.max(0, t - 0.55) * (RPM / 60) * Math.PI * 2;

  /* ── Open ──────────────────────────────────────────────────────────── */
  if (t < T.proof) {
    // Three rings out of nothing, before there is anything to see. The
    // record arrives on the third.
    for (let i = 0; i < 3; i++) {
      const p = seg(t, 0.12 + i * 0.16, 1.15 + i * 0.16);
      if (p > 0 && p < 1) {
        ctx.beginPath();
        ctx.arc(W / 2, Y(0.5), outQuint(p) * W * 0.62, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255,255,255," + (0.5 * (1 - p)).toFixed(3) + ")";
        ctx.stroke();
      }
    }

    // It forms in the middle, then makes room for the words. With no words
    // coming there is nothing to make room for, so it stays where it is.
    const rise = TEXT ? inOutCube(seg(t, 2.45, 3.35)) : 0;
    const cy   = mix(Y(0.5),   Y(0.315),  rise);
    const r    = mix(W * 0.335, W * 0.205, rise);

    record(W / 2, cy, r * mix(0.9, 1, outCubic(seg(t, 0.5, 1.4))), spin, {
      alpha:   seg(t, 0.45, 1.0),
      grooves: seg(t, 0.75, 1.9),
      label:   seg(t, 1.25, 2.1),
    });

    if (TEXT) {
      const out = 1 - seg(t, 4.85, 5.15);
      ctx.save();
      ctx.globalAlpha = out;
      lines(["Your music."], W / 2, Y(0.60), { size: 104, weight: 700, track: -2, p: seg(t, 2.95, 3.75) });
      lines(["Already on your phone."], W / 2, Y(0.685), { size: 52, weight: 400, colour: "#8e8e8e", p: seg(t, 3.65, 4.4) });
      ctx.restore();
    }
  }

  /* ── Proof ─────────────────────────────────────────────────────────────
     One phone for all three beats. It arrives once and stays put; the screen
     inside it changes under a wipe. Cutting the whole phone away and back
     three times would be restless, and would read as a slideshow. ─────── */
  else if (t < PROOF_END) {
    // With no headline above it the phone can sit higher and fill more.
    const top   = Y(TEXT ? 0.225 : 0.135);
    const width = W * 0.705;
    const entry = outQuint(seg(t, T.proof, T.proof + 0.62));
    // The whole beat leaves together. Fading the words while the phone cut
    // away underneath them was the one edit in here that looked like an
    // accident.
    const fade  = 1 - seg(t, PROOF_END - 0.3, PROOF_END);

    let idx = 0;
    for (let i = 0; i < BEATS.length; i++) if (t >= BEATS[i].at) idx = i;
    const beat = BEATS[idx];
    const prev = BEATS[idx - 1];
    const wipe = idx > 0 ? seg(t, beat.at, beat.at + 0.55) : 1;
    const held = t - beat.at;

    ctx.save();
    ctx.globalAlpha = entry * fade;
    ctx.translate(0, (1 - entry) * 190);

    phone(W / 2, top, width, (sx, sy, sw) => {
      const zoomOf = b => 1 + 0.035 * inOutCube(clamp01((t - b.at) / BEAT_LEN));
      if (prev && wipe < 1) screen(prev.shot, sx, sy, sw, zoomOf(prev));
      const cut = (H - sy + 140) * inOutCube(wipe);
      ctx.save();
      ctx.beginPath(); ctx.rect(sx, sy, sw, cut); ctx.clip();
      screen(beat.shot, sx, sy, sw, zoomOf(beat));
      ctx.restore();
      // The edge of the cut, lit for the half second it is travelling.
      if (wipe > 0 && wipe < 1) {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fillRect(sx, sy + cut - 6, sw, 6);
      }
    });

    ctx.restore();

    if (TEXT) {
      ctx.save();
      ctx.globalAlpha = fade;
      lines(beat.head, W / 2, Y(0.112), {
        size: 66, weight: 600, lead: 82,
        p: idx === 0 ? seg(t, T.proof + 0.35, T.proof + 1.15) : clamp01(held / 0.8),
        stagger: 0.2,
      });
      ctx.restore();
    }
  }

  /* ── Facts ────────────────────────────────────────────────────────────
     Back to nothing. Three lines, each landing on its own beat. The size is
     what the competition cannot answer. ──────────────────────────────── */
  else if (TEXT && t < T.end) {
    const l = t - T.facts;
    const out = 1 - seg(t, T.end - 0.3, T.end);
    ctx.save();
    ctx.globalAlpha = out;
    // One line per beat of the bar, so each lands with a hit rather than near
    // one. BEAT is the quarter note the whole film is cut to.
    line("No ads.",          W / 2, Y(0.40), { size: 98, weight: 700, track: -2, p: seg(l, 0 * BEAT, 0 * BEAT + 0.5) });
    line("No subscription.", W / 2, Y(0.52), { size: 98, weight: 700, track: -2, p: seg(l, 1 * BEAT, 1 * BEAT + 0.5) });
    line("No problems.",     W / 2, Y(0.64), { size: 98, weight: 700, track: -2, p: seg(l, 2 * BEAT, 2 * BEAT + 0.5) });
    ctx.restore();
  }

  /* ── End ──────────────────────────────────────────────────────────────
     It holds on the last frame rather than fading out, so the card can be
     frozen for as long as a post needs it. ───────────────────────────── */
  else {
    const l = t - T.end;
    const p = outQuint(seg(l, 0, 0.55));
    // Coming to rest with the mark upright. The record has been turning for
    // the whole film, and a logo frozen at whatever angle the last frame
    // happened to catch is not a logo, it is a mistake.
    const settle = (1 - outCubic(seg(l, 0, 1.9))) * 2.4;
    record(W / 2, Y(0.355), W * 0.20 * mix(0.84, 1, p), settle, { alpha: p });
    line("MPTree", W / 2, Y(0.60), { size: 108, weight: 700, track: -3, p: seg(l, 0.45, 1.15) });
    if (TEXT) {
      line("An offline music player.", W / 2, Y(0.665), { size: 46, weight: 400, colour: "#8e8e8e", p: seg(l, 0.85, 1.55) });
      line("Google Play  ·  mp-tree.net", W / 2, Y(0.775), { size: 40, weight: 500, colour: "#6a6a6a", track: 1, p: seg(l, 1.3, 2.0) });
    } else {
      // The clean cut has said nothing for nineteen seconds, so the one line
      // it does say is the one that matters.
      line("Now on Google Play", W / 2, Y(0.672), { size: 54, weight: 500, colour: "#b4b4b4", p: seg(l, 0.9, 1.6) });
    }
  }
}

/* ── The score ────────────────────────────────────────────────────────────
   Written here rather than laid over the top afterwards, for two reasons.
   It is original, so nothing about using it needs clearing with anyone. And
   it is built on the same grid as the edit: one bar to a phone beat, so the
   hits land on the cuts instead of near them.

   A minor, 87.8 BPM, five voices and a lot of space. Restraint is the brand.
   ─────────────────────────────────────────────────────────────────────── */
const NOTE = {
  F1: 43.65, G1: 49.00, A1: 55.00, C2: 65.41,
  A3: 220.0, C4: 261.6, D4: 293.7, E4: 329.6, G4: 392.0,
  A4: 440.0, C5: 523.3, D5: 587.3, E5: 659.3, A5: 880.0,
};

/** A hall, made out of decaying noise. Without it the parts sound like parts. */
function makeHall(ac) {
  const len = Math.floor(ac.sampleRate * 2.4);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const decay = Math.pow(1 - i / len, 2.6);
      d[i] = (Math.random() * 2 - 1) * decay;
    }
  }
  const conv = ac.createConvolver();
  conv.buffer = buf;
  return conv;
}

function buildScore(ac, out, t0) {
  // 0.76, not 0.9: at 0.9 the loudest kick came out at 1.084 and clipped, and
  // the compressor after it cannot pull back a peak it has already passed.
  // --score prints this envelope, so it is measured rather than judged by ear.
  const master = ac.createGain();
  master.gain.value = 0.76;
  // The last bells are still ringing when the film ends. Cutting a live room
  // off mid tail is one of the few things an audience hears as a mistake, so
  // the room is closed rather than chopped.
  master.gain.setValueAtTime(0.76, t0 + DURATION - 0.5);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + DURATION - 0.03);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.22;
  master.connect(comp).connect(out);

  const hall = makeHall(ac);
  const wet = ac.createGain(); wet.gain.value = 0.32;
  hall.connect(wet).connect(master);

  /** Everything goes to the room as well as to the front. */
  const voice = (node, send = 1) => {
    node.connect(master);
    if (send > 0) { const s = ac.createGain(); s.gain.value = send; node.connect(s).connect(hall); }
  };

  const at = b => t0 + b;   // b is seconds into the film

  function kick(b, gain = 0.9) {
    const t = at(b);
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(125, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g); voice(g, 0.08);
    o.start(t); o.stop(t + 0.5);
  }

  function hat(b, gain = 0.05) {
    const t = at(b), len = 0.05;
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * len), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 5);
    const src = ac.createBufferSource(); src.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7200;
    const g = ac.createGain(); g.gain.value = gain;
    src.connect(hp).connect(g); voice(g, 0.5);
    src.start(t);
  }

  function sub(b, freq, dur, gain = 0.5) {
    const t = at(b);
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = freq;
    // A second an octave up, quiet, so it survives a phone speaker that cannot
    // reproduce 55 Hz at all.
    const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2;
    const g = ac.createGain(), g2 = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.16);
    g.gain.setValueAtTime(gain, t + dur - 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g2.gain.value = 0.16;
    o.connect(g); o2.connect(g2).connect(g); voice(g, 0);
    o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  }

  function bell(b, freq, gain = 0.22, tail = 1.8) {
    const t = at(b);
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = freq;
    // A partial slightly off the octave is what stops a sine reading as a beep.
    const p = ac.createOscillator(); p.type = "sine"; p.frequency.value = freq * 2.01;
    const pg = ac.createGain(); pg.gain.value = 0.3;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + tail);
    o.connect(g); p.connect(pg).connect(g); voice(g, 0.9);
    o.start(t); p.start(t); o.stop(t + tail); p.stop(t + tail);
  }

  function pad(b, freqs, dur, gain = 0.09) {
    const t = at(b);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.7);
    g.gain.setValueAtTime(gain, t + dur - 1.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.5;
    lp.connect(g); voice(g, 1.1);
    for (const f of freqs) for (const detune of [-6, 6]) {
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.value = f; o.detune.value = detune;
      const og = ac.createGain(); og.gain.value = 0.22;
      o.connect(og).connect(lp);
      o.start(t); o.stop(t + dur + 0.2);
    }
  }

  /** The rising noise that carries the opening into the first downbeat. */
  function swell(b, dur, gain = 0.10) {
    const t = at(b);
    const len = Math.ceil(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(400, t);
    bp.frequency.exponentialRampToValueAtTime(5200, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.92);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g); voice(g, 0.7);
    src.start(t); src.stop(t + dur);
  }

  const bar = n => BAR0 + n * BEAT_LEN;   // bar 2 is the first phone beat

  /* Bar 1, under the rings. Nothing but a floor and something approaching. */
  sub(0.35, NOTE.A1, 2.3, 0.34);
  swell(0.9, 1.55, 0.085);

  /* Bar 2, the record has formed and the words arrive. */
  kick(bar(1), 0.85);
  kick(bar(1) + 2 * BEAT, 0.6);
  sub(bar(1), NOTE.A1, BEAT_LEN, 0.46);
  bell(bar(1), NOTE.A4, 0.2);
  bell(bar(1) + 2.5 * BEAT, NOTE.E5, 0.13);

  /* Bars 3 to 5, one to a screen. The bass moves, nothing else does much. */
  const roots = [NOTE.A1, NOTE.F1, NOTE.G1];
  const tops  = [[NOTE.A4, NOTE.C5], [NOTE.C5, NOTE.A4], [NOTE.G4, NOTE.D5]];
  for (let i = 0; i < 3; i++) {
    const b = bar(2 + i);
    sub(b, roots[i], BEAT_LEN, 0.5);
    kick(b, 0.9);
    kick(b + 2 * BEAT, 0.72);
    for (let e = 1; e < 8; e++) hat(b + e * BEAT / 2, e % 2 ? 0.032 : 0.05);
    bell(b, tops[i][0], 0.19);
    bell(b + 2 * BEAT, tops[i][1], 0.14);
  }

  /* Bar 6, the statement. Everything else gets out of the way and three hits
     land with the three lines. */
  for (let i = 0; i < 3; i++) {
    const b = bar(5) + i * BEAT;
    kick(b, 1.0);
    sub(b, NOTE.A1, BEAT * 0.95, 0.52);
    bell(b, [NOTE.A4, NOTE.C5, NOTE.E5][i], 0.24, 2.2);
  }

  /* Bar 7, the end card. It resolves and is allowed to ring out. */
  const e = bar(6);
  kick(e, 0.7);
  sub(e, NOTE.A1, 2.55, 0.44);
  pad(e, [NOTE.A3, NOTE.C4, NOTE.E4], 2.7, 0.085);
  bell(e, NOTE.A4, 0.2, 2.4);
  bell(e + 1 * BEAT, NOTE.C5, 0.15, 2.2);
  bell(e + 2 * BEAT, NOTE.E5, 0.13, 2.2);
  bell(e + 3 * BEAT, NOTE.A5, 0.11, 2.6);
}

/* ── Rendering ────────────────────────────────────────────────────────────
   The recorder takes exactly the frames it is handed: the stream is created
   at 0 fps and each frame is pushed by hand. What it cannot take from us is
   its own clock, so the pushes are paced against the wall to keep the file's
   timing honest, and the pacing corrects itself rather than drifting. ── */
const ready = Promise.all(
  Object.values(imgs).map(im => im.decode().catch(() => {}))
).then(() => document.fonts ? document.fonts.ready : null);

window.adReady   = () => ready.then(() => true);
window.adTotal   = () => TOTAL;
window.adFrame   = i => { drawFrame(i); return cv.toDataURL("image/png"); };

window.adRecord = async function (mime, bitrate, sound) {
  await ready;
  const stream = cv.captureStream(0);
  const track  = stream.getVideoTracks()[0];

  /* ── Sound ──────────────────────────────────────────────────────────────
     The audio is a live track on the same stream, so the recorder muxes it
     into the file itself. Both clocks run in real time: the frames are paced
     against performance.now() and the score is scheduled on the audio clock,
     so starting them together is all the syncing there is to do. ───────── */
  let ac = null, voNotes = [];
  if (sound) {
    ac = new AudioContext({ sampleRate: 48000 });
    if (ac.state === "suspended") { try { await ac.resume(); } catch { /* headless has no gesture to give */ } }
    const dest = ac.createMediaStreamDestination();

    // Decode the voice clips before anything is scheduled: decoding takes
    // long enough to shift the first line if it happens on the clock.
    for (const v of VOICE) {
      const bytes = Uint8Array.from(atob(v.audio.slice(v.audio.indexOf(",") + 1)), c => c.charCodeAt(0));
      voNotes.push({ at: v.at, buffer: await ac.decodeAudioData(bytes.buffer), gain: v.gain === undefined ? 1 : v.gain });
    }

    const musicOut = ac.createGain();
    // Under a voice the score steps back; on its own it carries the film.
    musicOut.gain.value = voNotes.length ? 0.46 : 1;
    musicOut.connect(dest);

    const lead = 0.18;                       // enough to schedule without a scramble
    const start = ac.currentTime + lead;
    if (sound !== "voice-only") buildScore(ac, musicOut, start);
    for (const n of voNotes) {
      const src = ac.createBufferSource(); src.buffer = n.buffer;
      const g = ac.createGain(); g.gain.value = n.gain;
      src.connect(g).connect(dest);
      src.start(start + n.at);
    }

    stream.addTrack(dest.stream.getAudioTracks()[0]);
    // Hold the video until the audio clock reaches the downbeat we scheduled
    // against, so frame 0 and second 0 are the same moment.
    while (ac.currentTime < start) await new Promise(r => setTimeout(r, 2));
  }

  const rec = new MediaRecorder(stream, Object.assign(
    { mimeType: mime, videoBitsPerSecond: bitrate },
    ac ? { audioBitsPerSecond: 192000 } : {},
  ));
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });

  drawFrame(0);
  rec.start();
  const t0 = performance.now();
  let late = 0;
  for (let f = 0; f < TOTAL; f++) {
    drawFrame(f);
    track.requestFrame();
    const due = t0 + (f + 1) * (1000 / FPS);
    const wait = due - performance.now();
    if (wait > 1) await new Promise(r => setTimeout(r, wait));
    else if (wait < 0) late++;
  }
  // The recorder stamps frames by the wall clock, so a machine that cannot
  // draw one in time does not drop it, it stretches the film. Worth knowing
  // rather than shipping something quietly running slow.
  window.__drift = {
    late,
    wall:     (performance.now() - t0) / 1000,
    intended: TOTAL / FPS,
  };
  // The last frame needs a moment on screen or the encoder gives it no length.
  await new Promise(r => setTimeout(r, 260));
  rec.stop();
  await stopped;
  if (ac) { try { await ac.close(); } catch { /* already gone */ } }

  const blob = new Blob(chunks, { type: mime });
  const buf  = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  window.__out = btoa(s);
  return window.__out.length;
};
window.adSlice = (from, len) => window.__out.substr(from, len);
window.adDrift = () => window.__drift || null;

/** Renders the score on its own, off the clock, and reports what it actually
 *  produced: the loudest point in each slice of the film. Cheap way to see
 *  that the hits are where the cuts are, without listening to anything. */
window.adScoreProbe = async function (slice) {
  const oac = new OfflineAudioContext(2, Math.ceil(48000 * DURATION), 48000);
  buildScore(oac, oac.destination, 0);
  const buf = await oac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const per = Math.floor(48000 * slice);
  const out = [];
  for (let i = 0; i < L.length; i += per) {
    let peak = 0, sum = 0, n = 0;
    for (let j = i; j < Math.min(i + per, L.length); j++) {
      const v = Math.max(Math.abs(L[j]), Math.abs(R[j]));
      if (v > peak) peak = v;
      sum += v * v; n++;
    }
    out.push({ t: +(i / 48000).toFixed(2), peak: +peak.toFixed(3), rms: +Math.sqrt(sum / n).toFixed(3) });
  }
  return out;
};

/** Milliseconds a frame, measured over the stretch that costs the most: a
 *  wipe, where two full screenshots are resampled into the same frame. */

/* ── Preview ──────────────────────────────────────────────────────────────
   Opened by hand rather than by the renderer, it just plays, on a loop. */
if (location.hash !== "#render") {
  ready.then(() => {
    const t0 = performance.now();
    (function loop(now) {
      drawFrame(Math.floor(((now - t0) / 1000 % (DURATION + 1.2)) * FPS) % TOTAL);
      requestAnimationFrame(loop);
    })(t0);
  });
} else {
  ready.then(() => drawFrame(0));
}
</script>
