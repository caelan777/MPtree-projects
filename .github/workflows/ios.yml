# The iPhone app, built on one of GitHub's Macs (free for a public repo).
#
# It comes out unsigned, as MPTree.ipa attached to the run. Sideloadly signs
# it with an Apple ID when it is put on the iPhone: see docs/ios.md.
#
# Runs on every push to the ios branch that touches the app, and by hand
# (Actions, "iPhone build", Run workflow) once this file is on main too.
name: iPhone build

on:
  push:
    branches: [ios]
    paths: [MPTree-App/**, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MPTree-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MPTree-App/package-lock.json

      - name: Web app
        run: |
          npm ci
          npm run build:ios

      # Also rewrites ios/App/CapApp-SPM/Package.swift with this Mac's paths
      # (a sync on Windows writes them with backslashes).
      - name: Copy it into the iOS project
        run: npx cap sync ios

      - name: Build
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Make MPTree.ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          cd ipa && zip -qr ../MPTree.ipa Payload
          ls -l ../MPTree.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MPTree-iPhone-${{ github.run_number }}
          path: MPTree-App/MPTree.ipa
          retention-days: 30

  # The same app on an iPhone simulator: it starts, and screenshots of what it
  # shows come out as MPTree-simulator-<n> on the run.
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MPTree-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MPTree-App/package-lock.json

      - name: Web app
        run: |
          npm ci
          VITE_SIM_TOUR=1 npm run build:ios
          npx cap sync ios

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO

      - name: Start it, add test songs, tap through it
        run: |
          mkdir -p shots songs
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl privacy "$DEV" grant media-library com.caelan.mptree || true
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/App.app
          # Three short tones as songs, in the app's own folder (Files, MPTree).
          python3 -c "
          import math,struct,wave
          for i,(name,f) in enumerate([('Test Song One',440),('Test Song Two',523),('Test Song Three',659)]):
              w=wave.open(f'songs/{name}.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050)
              w.writeframes(b''.join(struct.pack('<h',int(8000*math.sin(2*math.pi*f*t/22050))) for t in range(22050*20)))
          "
          DOCS="$(xcrun simctl get_app_container "$DEV" com.caelan.mptree data)/Documents"
          mkdir -p "$DOCS"
          for f in songs/*.wav; do afconvert -f m4af -d aac "$f" "$DOCS/$(basename "${f%.wav}").m4a"; done
          ls -l "$DOCS"
          xcrun simctl launch --console-pty "$DEV" com.caelan.mptree > shots/console.log 2>&1 &
          T0=$(date +%s)
          shot() { xcrun simctl io "$DEV" screenshot "shots/$1.png" >/dev/null 2>&1; echo "$1 at $(( $(date +%s) - T0 ))s"; }
          sleep 12; shot 0-welcome
          # One screenshot 3 s after each tap the app makes (simTour.ts).
          for k in 1 2 3 4 5 6; do
            until [ "$(grep -ac 'tour\] ' shots/console.log)" -gt $k ]; do sleep 1; done
            sleep 3; shot "$k-$(grep -a 'tour\] ' shots/console.log | sed -n "$((k+1))p" | sed 's/.*tour\] //; s/[^A-Za-z]/-/g')"
          done
          sleep 15; shot 7-after-the-song
          grep "\[tour\]" shots/console.log || true
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MPTree-simulator-${{ github.run_number }}
          path: MPTree-App/shots
          retention-days: 30
