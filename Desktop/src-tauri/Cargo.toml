[package]
name = "mptree-desktop"
version = "0.1.0"
description = "MPTree for Windows"
edition = "2021"

[lib]
name = "mptree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"
trash = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
crc32fast = "1"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
