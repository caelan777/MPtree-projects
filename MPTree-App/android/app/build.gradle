apply plugin: 'com.android.application'

// Release signing. Secrets live in android/keystore.properties, which is
// gitignored and must never be committed. When that file is absent (a fresh
// clone, or CI without secrets) the release build simply falls back to unsigned
// output rather than failing, so the project still builds for anyone.
// The ad SDK (the :ads module, for the Pro day pass) goes into the Play build
// and the Pro test build only. The website APK carries no ad code at all. Which
// one this is comes from the web build that cap sync copied in (vite.config.ts
// writes channel.txt), so the usual commands do the right thing on their own.
// -Pads=true or -Pads=false overrides it.
def channelFile = file("src/main/assets/public/channel.txt")
def channel = channelFile.exists() ? channelFile.text.trim() : "web"
def withAds = project.hasProperty("ads") ? project.property("ads").toString() == "true" : channel in ["play", "test"]
logger.lifecycle("MPTree: web build for '${channel}', ${withAds ? 'with' : 'without'} the ad SDK")

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.caelan.mptree"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.caelan.mptree"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep versionName in step with package.json. versionCode must increase
        // by at least 1 for every release you hand out, or Android will refuse
        // to install the update over an existing copy.
        // 19 was the MPTree Pro test build on mp-tree.net/test.html; 20 is 1.1.0
        // for Google Play, the first release with Pro.
        versionCode 20
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.0"   // ← add this line — provides NotificationCompat.MediaStyle
    // Google Play's own "a newer version is out" check, for the Play build only.
    // It talks to the Play Store app on the phone, not to the network itself.
    implementation "com.google.android.play:app-update:2.1.0"
    // Google Play Billing, for MPTree Pro (a one-time purchase). Talks to the
    // Play Store app on the phone; see BillingPlugin.java.
    implementation "com.android.billingclient:billing:8.0.0"
    // The Pro day pass ad, Play and test builds only (see withAds above).
    if (withAds) implementation project(':ads')
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
