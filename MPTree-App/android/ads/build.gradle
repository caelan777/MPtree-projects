apply plugin: 'com.android.library'

// The Pro day pass ad: AdsPlugin, Google Mobile Ads and Google's consent form.
// A module of its own so the website APK can leave all of it out; the app only
// depends on it for the Play and test builds (see app/build.gradle).

android {
    namespace = "com.caelan.mptree.ads"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
}
